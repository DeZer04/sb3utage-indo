title: "[HP] "
body:
  - type: markdown
    attributes:
      value: |
        Bagikan hasil di HP kamu, lancar atau tidak. Laporan ini dipakai untuk mengisi daftar *Tested phones* di README dan menentukan pengaturan bawaan tiap HP.

        Judul sebaiknya berisi nama HP, misalnya **[HP] Redmi 10 2022 – 30 FPS di preset Low**.
  - type: input
    id: device
    attributes:
      label: HP
      description: Merek, model, dan chip/GPU (Pengaturan > Sistem > Device Info).
      placeholder: "contoh: Redmi 10 2022, Helio G88 / Mali-G52 MC2"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Versi Android dan versi aplikasi
      placeholder: "contoh: Android 13, aplikasi 1.0.6.1"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Pengaturan
      description: Preset, Resolusi Render, Kunci 30 FPS, renderer, patch, dan pengaturan lain yang kamu ubah.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Hasil
      description: FPS di menu, saat battle sepi, dan saat battle ramai. Ceritakan juga kalau ada masalah.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (opsional, tapi sangat membantu)
      description: Zip dari Pengaturan > Sistem > Share Log setelah main 10–15 menit.
