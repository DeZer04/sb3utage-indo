plugins {
    id 'com.android.application'
}

// -PbasaraPgo: the instrumented build that collects a PGO profile (tools/b-pgo.ps1 gen): its own package
// (io.github.dezer04.sb3utage.pgo, "SB3 UTAGE PGO"), so it installs next to the release.
def pgo = project.hasProperty('basaraPgo')
// SB3 UTAGE:INDO: Sengoku Basara 3 Utage (S3HJ08) on this runtime, its own app (io.github.dezer04.sb3utage,
// next to the patcher io.github.dezer04.sbh2). The Java package is the same since 0.6.0, and so are
// the native JNI names (Java_io_github_dezer04_sb3utage_*).

android {
    namespace 'io.github.dezer04.sb3utage'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'io.github.dezer04.sb3utage'
        // Guest RAM uses memfd_create, which bionic has from Android 11 (API 30).
        minSdk 29
        targetSdk 34
        // -PbasaraVersionCode / -PbasaraVersionName: a newer build for testing the updater.
        versionCode((project.findProperty('basaraVersionCode') ?: '1') as int)
        versionName(project.findProperty('basaraVersionName') ?: '0.5.0')
        // Updates from this app's own GitHub releases (DeZer04/sb3utage-indo, pre-releases included:
        // Updater). -PbasaraOfflineUpdates: off, for a build handed out by hand.
        buildConfigField 'boolean', 'ONLINE_UPDATES', (!project.hasProperty('basaraOfflineUpdates')).toString()
        // -PbasaraCheats=false hides Settings > Cheats (Utage's since 1.0.0: runtime cheats.cpp Apply).
        def cheats = project.findProperty('basaraCheats')
        buildConfigField 'boolean', 'CHEATS', (cheats != null ? (cheats.toString() == 'true') : true).toString()
        if (pgo) {
            applicationIdSuffix '.pgo'
        }
        manifestPlaceholders = [appLabel: pgo ? 'SB3 UTAGE PGO' : 'SB3 UTAGE:INDO']
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // -PbasaraSigning=<file>: a properties file (basara.keystore, basara.keystorePassword, basara.keyAlias)
    // with the release key, so each build installs over the last. Kept out of the repo.
    def signingFile = project.findProperty('basaraSigning')
    signingConfigs {
        if (signingFile != null) {
            release {
                def props = new Properties()
                file(signingFile).withInputStream { props.load(it) }
                storeFile file(props['basara.keystore'])
                storePassword props['basara.keystorePassword']
                keyAlias props['basara.keyAlias']
                keyPassword props['basara.keystorePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Personal builds: sign with the local debug key so the APK installs directly.
            signingConfig signingFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        // Release builds skip lint's vital checks: this machine builds offline, without lint's jars.
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // libmain.so and the runtime's data files are staged by tools/b-android.ps1 -Mode stage from
            // the native build (generated/android-build); they are not checked in.
            jniLibs.srcDirs = ['../generated/android-native/jniLibs']
            assets.srcDirs = ['../generated/android-native/assets', 'src/main/assets']
        }
    }

    packagingOptions {
        jniLibs {
            // libmain.so compressed in the APK (107 MB -> about 45 MB to download); Android extracts it
            // once at install. Mapping it in place uncompressed saved that disk copy but made the
            // download more than twice as large.
            useLegacyPackaging true
        }
    }
}
